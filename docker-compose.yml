version: '3.8'

services:
  acoustic-side-channel-keystroke:
    build: .
    container_name: acoustic-side-channel-keystroke
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=acoustic-side-channel-keystroke-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
