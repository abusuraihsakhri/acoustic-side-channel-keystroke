[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-side-channel-keystroke"
version = "2.0.0"
description = "Acoustic Side-Channel Keystroke & Power Hum Classifier Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
acoustic-side-channel-keystroke = "acoustic_side_channel.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/acoustic-side-channel-keystroke"
Repository = "https://github.com/abusuraihsakhri/acoustic-side-channel-keystroke.git"
